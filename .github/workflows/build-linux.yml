name: Build-Linux

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            fuse \
            libfuse2 \
            desktop-file-utils

      - name: Install GCC 14 (for C++23)
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt install gcc-14 g++-14 -y
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
                                  --slave /usr/bin/g++ g++ /usr/bin/g++-14

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          host: linux
          target: desktop
          arch: linux_gcc_64
          version: '6.8.3'

      - name: Configure
        run: >
          cmake
          -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DAPP_VERSION=${{ inputs.version }}"

      - name: Build
        run: cmake --build build --config Release --target CubedLauncher

      - name: Install App
        run: |
          cmake --install build --prefix AppDir/usr

      - name: Install linuxdeploy
        uses: miurahr/install-linuxdeploy-action@v1
        with:
          plugins: qt appimage

      - name: Build AppImage
        env:
          QML_SOURCES_PATHS: "qml"
          LDAI_OUTPUT: "CubedLauncher-${{ inputs.version }}-linux-x64.AppImage"
        run: |
          linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/CubedLauncher.desktop \
            --plugin qt \
            --output appimage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            *.AppImage
