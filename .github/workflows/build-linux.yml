name: Build-Linux

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      package:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-release

      - name: Install Linux Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            fuse \
            libfuse2 \
            desktop-file-utils \
            libssl-dev \
            xauth \
            xvfb

      - name: Install GCC 14 (for C++23)
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt install gcc-14 g++-14 -y
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
                                  --slave /usr/bin/g++ g++ /usr/bin/g++-14

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          host: linux
          target: desktop
          arch: linux_gcc_64
          version: '6.8.3'
          cache: true

      - name: Configure
        run: >
          cmake
          -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DAPP_VERSION=${{ inputs.version }}"

      - name: Build
        run: cmake --build build --config Release --target CubedLauncher

      - name: Install App
        if: inputs.package
        run: |
          cmake --install build --prefix AppDir/usr

      - name: Install linuxdeploy
        if: inputs.package
        uses: miurahr/install-linuxdeploy-action@v1
        with:
          plugins: qt appimage

      - name: Build AppImage
        if: inputs.package
        env:
          QML_SOURCES_PATHS: "qml"
          LDAI_OUTPUT: "CubedLauncher-${{ inputs.version }}-linux-x64.AppImage"
          NO_STRIP: "1"
        run: |
          QMAKE="$(command -v qmake)"
          export QMAKE
          "$QMAKE" -query QT_VERSION | grep -q '^6\.'
          OPENSSL_LIBDIR="$(pkg-config --variable=libdir openssl)"
          test -f "$OPENSSL_LIBDIR/libcrypto.so.3"
          test -f "$OPENSSL_LIBDIR/libssl.so.3"
          linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --library "$OPENSSL_LIBDIR/libcrypto.so.3" \
            --library "$OPENSSL_LIBDIR/libssl.so.3" \
            --desktop-file AppDir/usr/share/applications/CubedLauncher.desktop \
            --plugin qt \
            --output appimage

      - name: Verify AppImage Runtime
        if: inputs.package
        env:
          APPIMAGE_PATH: "CubedLauncher-${{ inputs.version }}-linux-x64.AppImage"
        run: |
          chmod +x "$APPIMAGE_PATH"
          "./$APPIMAGE_PATH" --appimage-extract >/dev/null
          test -f squashfs-root/usr/lib/libcrypto.so.3
          test -f squashfs-root/usr/lib/libssl.so.3
          if ldd squashfs-root/usr/bin/CubedLauncher | grep -q "not found"; then
            echo "The packaged launcher has unresolved shared libraries." >&2
            exit 1
          fi
          CRYPTO_PATH="$(ldd squashfs-root/usr/bin/CubedLauncher | awk '$1 == "libcrypto.so.3" { print $3 }')"
          test "$(readlink -f "$CRYPTO_PATH")" = "$(readlink -f squashfs-root/usr/lib/libcrypto.so.3)"
          TLS_BACKEND=squashfs-root/usr/plugins/tls/libqopensslbackend.so
          test -f "$TLS_BACKEND"
          if ldd "$TLS_BACKEND" | grep -q "not found"; then
            echo "The packaged Qt TLS backend has unresolved shared libraries." >&2
            exit 1
          fi
          SSL_PATH="$(ldd "$TLS_BACKEND" | awk '$1 == "libssl.so.3" { print $3 }')"
          TLS_CRYPTO_PATH="$(ldd "$TLS_BACKEND" | awk '$1 == "libcrypto.so.3" { print $3 }')"
          test "$(readlink -f "$SSL_PATH")" = "$(readlink -f squashfs-root/usr/lib/libssl.so.3)"
          test "$(readlink -f "$TLS_CRYPTO_PATH")" = "$(readlink -f squashfs-root/usr/lib/libcrypto.so.3)"
          set +e
          timeout 10s xvfb-run -a squashfs-root/AppRun
          APP_STATUS=$?
          set -e
          if [ "$APP_STATUS" -ne 124 ]; then
            echo "Packaged AppImage failed its runtime smoke test with status $APP_STATUS" >&2
            exit 1
          fi

      - name: Upload Linux Artifact
        if: inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            *.AppImage
