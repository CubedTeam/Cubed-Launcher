name: Release

on:
  workflow_run:
    workflows: ["Build-Windows", "Build-Linux"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - name: Get both workflow run IDs
        id: get-runs
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.workflow_run.head_branch;

            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_branch: branch,
              status: 'success'
            });

            const windowsRun = runs.workflow_runs.find(run => run.name === 'Build-Windows');
            const linuxRun = runs.workflow_runs.find(run => run.name === 'Build-Linux');

            if (!windowsRun || !linuxRun) {
              core.setFailed('Both Build-Windows and Build-Linux must succeed first');
              return;
            }

            core.setOutput('windows-run-id', windowsRun.id);
            core.setOutput('linux-run-id', linuxRun.id);

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts
          run-id: ${{ steps.get-runs.outputs.windows-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts
          run-id: ${{ steps.get-runs.outputs.linux-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256
        run: |
          cd artifacts
          find . -type f | while read file
          do
            sha256sum "$file"
          done > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            artifacts/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
