name: Build-Windows

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      core_version:
        required: true
        type: string
      package:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-release
          variant: sccache

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          version: '6.8.3'
          cache: true

      - name: Install OpenSSL
        shell: pwsh
        run: |
          choco install openssl --version=3.6.2 --allow-downgrade -y --no-progress
          $candidateRoots = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL"
          )
          $opensslRoot = $candidateRoots |
            Where-Object {
              Test-Path (Join-Path $_ "include\openssl\opensslv.h")
            } |
            Select-Object -First 1
          if ($null -eq $opensslRoot) {
            throw "Could not locate the OpenSSL installation root."
          }
          $cryptoLibraries = @(Get-ChildItem `
            (Join-Path $opensslRoot "lib") `
            -Filter "libcrypto.lib" `
            -File `
            -Recurse)
          $cryptoLibrary = $cryptoLibraries |
            Where-Object { $_.FullName -match "\\VC\\x64\\MD\\" } |
            Select-Object -First 1
          if ($null -eq $cryptoLibrary) {
            $cryptoLibrary = $cryptoLibraries | Select-Object -First 1
          }
          if ($null -eq $cryptoLibrary) {
            throw "Could not locate the OpenSSL Crypto import library."
          }
          $opensslInclude = Join-Path $opensslRoot "include"
          $cryptoRuntime = Join-Path $opensslRoot "bin\libcrypto-3-x64.dll"
          $sslRuntime = Join-Path $opensslRoot "bin\libssl-3-x64.dll"
          if (-not (Test-Path $cryptoRuntime) -or -not (Test-Path $sslRuntime)) {
            throw "The expected OpenSSL 3 runtime DLLs are missing."
          }
          "OPENSSL_ROOT_DIR=$opensslRoot" >> $env:GITHUB_ENV
          "OPENSSL_INCLUDE_DIR=$opensslInclude" >> $env:GITHUB_ENV
          "OPENSSL_CRYPTO_LIBRARY=$($cryptoLibrary.FullName)" >> $env:GITHUB_ENV
          Write-Host "Using OpenSSL from $opensslRoot"

      - name: Configure
        shell: pwsh
        run: >
          cmake
          -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          "-DOPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR"
          "-DOPENSSL_INCLUDE_DIR=$env:OPENSSL_INCLUDE_DIR"
          "-DOPENSSL_CRYPTO_LIBRARY=$env:OPENSSL_CRYPTO_LIBRARY"
          "-DAPP_VERSION=${{ inputs.version }}"

      - name: Build
        run: cmake --build build --config Release --target CubedLauncher

      - name: Deploy Qt
        if: inputs.package
        shell: cmd
        run: |
          windeployqt --release --qmldir qml build\CubedLauncher\CubedLauncher.exe

      - name: Verify OpenSSL Deployment
        if: inputs.package
        shell: pwsh
        run: |
          $cryptoDll = @(Get-ChildItem `
            "build\CubedLauncher\libcrypto-3*.dll" `
            -ErrorAction Stop)
          if ($cryptoDll.Count -ne 1) {
            throw "Expected exactly one OpenSSL Crypto runtime DLL."
          }
          $sslDll = @(Get-ChildItem `
            "build\CubedLauncher\libssl-3*.dll" `
            -ErrorAction Stop)
          if ($sslDll.Count -ne 1) {
            throw "Expected exactly one OpenSSL SSL runtime DLL."
          }

      - name: Smoke Test Windows Bundle
        if: inputs.package
        shell: pwsh
        run: |
          $bundleDir = (Resolve-Path "build\CubedLauncher").Path
          $originalPath = $env:PATH
          $env:PATH = "$bundleDir;${env:SystemRoot}\System32;${env:SystemRoot}"
          $process = $null
          try {
            $process = Start-Process `
              "$bundleDir\CubedLauncher.exe" `
              -WorkingDirectory $bundleDir `
              -PassThru
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "CubedLauncher exited during the packaged runtime smoke test with code $($process.ExitCode)."
            }
          } finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id
              $process.WaitForExit()
            }
            $env:PATH = $originalPath
          }

      - name: Install Inno Setup
        if: inputs.package
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        if: inputs.package
        shell: cmd
        run: |
          iscc /DCubedLauncherVersion=${{ inputs.version }} /DCubedLauncherFileVersion=${{ inputs.core_version }}.0 installer\installer.iss

      - name: Create Portable Zip
        if: inputs.package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/CubedLauncher/* `
            -DestinationPath CubedLauncher-${{ inputs.version }}-windows-x64-portable.zip

      - name: Upload Windows Artifacts
        if: inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installer/output/*.exe
            *.zip
